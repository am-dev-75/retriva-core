openapi: 3.1.0
info:
  title: Retriva Core API
  description: |
    Retriva Core provides APIs for document ingestion, chunking, indexing,
    retrieval, and OpenAI-compatible RAG chat completions.

    The Core runs as two processes:
    * **Ingestion API** (port 8000): Document processing pipeline, metadata, jobs, artifacts.
    * **OpenAI Chat API** (port 8001): OpenAI-compatible `/v1/chat/completions` for RAG.
  version: 1.5.1
  contact:
    name: Andrea Marson
    email: am.dev.75@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:8000
    description: Retriva Core — Ingestion API
  - url: http://localhost:8001
    description: Retriva Core — OpenAI Chat API

tags:
  - name: Ingestion v1 (legacy)
    description: Document and data processing pipeline (v1)
  - name: Jobs v1 (legacy)
    description: Ingestion job management (v1)
  - name: Ingestion v2
    description: Generic multi-tool document ingestion (v2)
  - name: Jobs v2
    description: Extended ingestion job management (v2)
  - name: Artifacts v2
    description: Document generation and rendering (v2)
  - name: Metadata v2
    description: Metadata schema and values discovery (v2)
  - name: Retrieval v2
    description: Vector and metadata-filtered retrieval (v2)
  - name: Knowledge Base v2
    description: Knowledge base management (v2)
  - name: Chat
    description: OpenAI-compatible retrieval and completion
  - name: Internal
    description: Debugging and observability endpoints

  - name: crm-archive
  - name: crm-assistant
  - name: crm-campaigns
  - name: crm-erp-identity
  - name: crm-imports
  - name: crm-postgres
  - name: v2-sessions
  - name: internal
paths:
  # --- Ingestion v1 (legacy) API ---
  /api/v1/ingest/text:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest plain text
      operationId: ingestText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TextIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/html:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest HTML content
      operationId: ingestHtml
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HtmlIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/pdf:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest PDF page
      operationId: ingestPdf
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PdfIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/markdown:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest Markdown sections
      operationId: ingestMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarkdownIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/image:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest local image file
      operationId: ingestImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/mediawiki:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest MediaWiki export page
      operationId: ingestMediaWiki
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaWikiIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/chunks:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest raw chunks
      operationId: ingestChunks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChunkIngestRequest"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/ingest/collection:
    delete:
      tags: [Ingestion v1 (legacy)]
      summary: Clear entire vector collection
      operationId: clearCollection
      responses:
        "200":
          description: Collection cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  /api/v1/documents/{doc_id}:
    delete:
      tags: [Ingestion v1 (legacy)]
      summary: Delete a document and its chunks
      operationId: deleteDocument
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted or not found (idempotent)

  # --- Jobs API ---
  /api/v1/jobs:
    get:
      tags: [Jobs v1]
      summary: List recent ingestion jobs
      operationId: listJobs
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobResponse"

  /api/v1/jobs/{job_id}:
    get:
      tags: [Jobs v1]
      summary: Get job status
      operationId: getJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"

  /api/v1/jobs/{job_id}/cancel:
    post:
      tags: [Jobs v1]
      summary: Request job cancellation
      description: |
        Requests cooperative cancellation of an ingestion job.

        This endpoint works for **both v1 and v2 jobs** — the underlying
        ``JobManager`` is shared.  When Celery is enabled, the Celery task
        is revoked and a Redis cancel flag is set so the worker can check
        it at cooperative checkpoints.

        State transitions:
        * Running/pending → 202 Accepted (status becomes `cancelling`)
        * Already cancelling/cancelled → 200 OK (idempotent)
        * Completed/failed → 409 Conflict
        * Unknown → 404 (unless Celery is enabled, in which case the Redis
          cancel flag is set and 202 is returned)
      operationId: cancelJob
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Already cancelling or cancelled (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "202":
          description: Cancellation requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "404":
          description: Job not found
        "409":
          description: Cannot cancel a job in a terminal state

  # --- v2 Ingestion API ---
  /api/v2:
    get:
      tags: [Ingestion v2]
      summary: Get v2 API info
      operationId: getV2Info
      responses:
        "200":
          description: Version and feature metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: { type: string }
                  api_version: { type: string }
                  status: { type: string }
                  features:
                    type: array
                    items: { type: string }
                  message: { type: string }

  /api/v2/capabilities:
    get:
      tags: [Ingestion v2]
      summary: Unified system capabilities
      operationId: getV2Capabilities
      responses:
        "200":
          description: Ingestion parsers, stage tracking, and artifact templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  ingestion:
                    type: array
                    items: { type: string }
                  jobs:
                    type: array
                    items: { type: string }
                  artifacts:
                    type: array
                    items: { type: string }
                  artifact_types:
                    type: array
                    items: { type: string }

  /api/v2/documents:
    get:
      tags: [Ingestion v2]
      summary: List unique documents
      operationId: listDocumentsV2
      parameters:
        - name: user_metadata_filter
          in: query
          description: JSON-encoded metadata filter
          schema:
            type: string
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"
    post:
      tags: [Ingestion v2]
      summary: Generic multi-parser ingestion (JSON body)
      operationId: ingestDocumentV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentIngestRequestV2"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponseV2"

  /api/v2/documents/mediawiki:
    post:
      tags: [Ingestion v2]
      summary: Ingest a MediaWiki XML export directory (v2)
      operationId: ingestMediaWikiExportV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MediaWikiExportRequestV2"
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponseV2"

  /api/v2/documents/filter:
    post:
      tags: [Ingestion v2]
      summary: Filter documents via POST body
      operationId: filterDocumentsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentFilterRequest"
      responses:
        "200":
          description: Document list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /api/v2/documents/count:
    get:
      tags: [Ingestion v2]
      summary: Count unique documents
      operationId: countDocumentsV2
      parameters:
        - name: user_metadata_filter
          in: query
          description: JSON-encoded metadata filter
          schema:
            type: string
      responses:
        "200":
          description: Document count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentCountResponse"

  /api/v2/documents/upload:
    post:
      tags: [Ingestion v2]
      summary: Generic multi-parser ingestion (multipart upload)
      operationId: uploadDocumentV2
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_path]
              properties:
                file:
                  type: string
                  format: binary
                source_path:
                  type: string
                  description: Logic path/URI for the document
                content_type:
                  type: string
                  description: Optional MIME type hint
                user_metadata:
                  type: string
                  description: Optional JSON-encoded user metadata
                kb_id:
                  type: string
                  default: default
                  description: Target knowledge base id. Must exist in the registry.
                force:
                  type: boolean
                  default: false
                  description: |
                    Force re-ingestion even if a catalog record already exists
                    for the same content hash.  Also recovers from stale records
                    (status `pending`, zero chunks) left by a previous failed
                    attempt.  When `false` (default), duplicate uploads are
                    detected and skipped.
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponseV2"

  /api/v2/documents/{doc_id}:
    get:
      tags: [Ingestion v2]
      summary: Get document details
      operationId: getDocumentV2
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Document details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "404":
          description: Document not found
    delete:
      tags: [Ingestion v2]
      summary: Delete document and its chunks
      operationId: deleteDocumentV2
      parameters:
        - name: doc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Document deleted or not found

  /api/v2/documents/search:
    post:
      tags: [Ingestion v2]
      summary: Search documents with metadata filters and mode
      operationId: searchDocumentsV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentSearchRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentListResponse"

  /api/v2/documents/metadata/filter:
    delete:
      tags: [Ingestion v2]
      summary: Delete documents by metadata filter
      operationId: deleteDocumentsByMetadataV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMetadataRequest"
      responses:
        "204":
          description: Chunks deleted successfully

  # --- v2 Jobs API ---
  /api/v2/jobs:
    get:
      tags: [Jobs v2]
      summary: List recent v2 ingestion jobs
      operationId: listJobsV2
      responses:
        "200":
          description: List of jobs with stage information
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobResponseV2"

  /api/v2/jobs/{job_id}:
    get:
      tags: [Jobs v2]
      summary: Get v2 job status
      operationId: getJobV2
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job details with pipeline stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponseV2"

  # --- Metadata API (v2) ---
  /api/v2/metadata/schema:
    get:
      tags: [Metadata v2]
      summary: Get metadata schema
      operationId: getMetadataSchemaV2
      responses:
        "200":
          description: Available metadata keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataSchemaResponse"

  /api/v2/metadata/values:
    get:
      tags: [Metadata v2]
      summary: Get values for a metadata key
      operationId: getMetadataValuesV2
      parameters:
        - name: field
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Available values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  /api/v2/metadata/values/{key}:
    get:
      tags: [Metadata v2]
      summary: Get values for a metadata key (path param)
      description: |
        The `key` path parameter supports slashes (e.g. `user/project`),
        matching the FastAPI `{key:path}` converter.
      operationId: getMetadataValuesV2Path
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          description: Metadata key, may contain forward slashes.
      responses:
        "200":
          description: Available values
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetadataValuesResponse"

  # --- Retrieval API (v2) ---
  /api/v2/retrieval/query:
    post:
      tags: [Retrieval v2]
      summary: Vector search with metadata filters
      operationId: queryRetrievalV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetrievalRequest"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetrievalResponse"

  # --- Artifacts API (v2) ---
  /api/v2/artifacts:
    post:
      tags: [Artifacts v2]
      summary: Create artifact generation job
      operationId: createArtifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactRequestV2"
      responses:
        "202":
          description: Artifact job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactResponseV2"

  /api/v2/artifacts/{artifact_id}:
    get:
      tags: [Artifacts v2]
      summary: Get artifact metadata and status
      operationId: getArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Artifact job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponseV2"
        "404":
          description: Artifact not found
    delete:
      tags: [Artifacts v2]
      summary: Delete artifact
      operationId: deleteArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Artifact deleted or not found

  /api/v2/artifacts/{artifact_id}/content:
    get:
      tags: [Artifacts v2]
      summary: Download rendered artifact content
      operationId: getArtifactContent
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rendered file content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "202":
          description: Artifact generation still in progress
        "404":
          description: Artifact not found
        "410":
          description: Artifact generation failed; content is no longer available

  /api/v2/artifacts/capabilities:
    get:
      tags: [Artifacts v2]
      summary: Get system capabilities and renderers
      operationId: getCapabilities
      responses:
        "200":
          description: Capability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactCapabilitiesResponseV2"

  # --- Knowledge Base API (v2) ---
  /api/v2/kbs:
    get:
      tags: [Knowledge Base v2]
      summary: List knowledge bases
      operationId: listKBs
      responses:
        "200":
          description: List of KBs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBListResponse"
    post:
      tags: [Knowledge Base v2]
      summary: Create a knowledge base
      operationId: createKB
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KBCreateRequest"
      responses:
        "201":
          description: KB created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBResponse"
        "409":
          description: KB id already exists or is invalid

  /api/v2/kbs/{kb_id}:
    get:
      tags: [Knowledge Base v2]
      summary: Get a knowledge base
      operationId: getKB
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: KB details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBResponse"
        "404":
          description: KB not found
    patch:
      tags: [Knowledge Base v2]
      summary: Update a knowledge base
      operationId: updateKB
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KBUpdateRequest"
      responses:
        "200":
          description: KB updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KBResponse"
        "404":
          description: KB not found
        "409":
          description: Cannot modify the default KB
    delete:
      tags: [Knowledge Base v2]
      summary: Delete a knowledge base and cascade its data
      operationId: deleteKB
      parameters:
        - name: kb_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: KB deleted
        "404":
          description: KB not found
        "409":
          description: Cannot delete the default KB
        "500":
          description: Partial cascade failure

  # --- OpenAI Chat API ---
  /v1/models:
    get:
      tags: [Chat]
      summary: List available models (retriva, retriva-v2)
      operationId: listModels
      description: |
        Retriva exposes two model identifiers for OpenAI-compatible clients:
        `retriva` and `retriva-v2`. Both resolve to the same RAG pipeline.
      responses:
        "200":
          description: OpenAI-compatible model list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"

  /v1/chat/completions:
    post:
      tags: [Chat]
      summary: Chat completion with RAG
      operationId: chatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatCompletionRequest"
      responses:
        "200":
          description: Chat completion result (or stream if requested)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ChatCompletionResponse"
                  - type: string
                    format: binary
                    description: Server-Sent Events stream

  # --- v1 PDF file upload ---
  /api/v1/ingest/upload/pdf:
    post:
      tags: [Ingestion v1 (legacy)]
      summary: Ingest raw PDF file upload
      operationId: ingestPdfUpload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, source_path]
              properties:
                file:
                  type: string
                  format: binary
                source_path: { type: string }
                page_title: { type: string }
                user_metadata:
                  type: string
                  description: JSON-encoded user metadata
      responses:
        "202":
          description: Accepted for processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResponse"

  # --- v1 Delete by metadata ---
  /api/v1/documents/metadata/filter:
    delete:
      tags: [Ingestion v1 (legacy)]
      summary: Delete documents by metadata filter
      operationId: deleteDocumentsByMetadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteMetadataRequest"
      responses:
        "204":
          description: Chunks deleted successfully

  # --- Internal / Debug API ---
  /internal/profiler/log:
    get:
      tags: [Internal]
      summary: Get recent profiler logs
      operationId: getProfilerLogs
      description: Available only when ENABLE_INTERNAL_PROFILER=true.
      responses:
        "200":
          description: Recent structured profiler logs
        "404":
          description: Profiler is disabled

  # --- Health ---
  /health:
    get:
      tags: [Internal]
      summary: Health check
      operationId: getHealth
      description: Available on both the Ingestion API (8000) and OpenAI API (8001).
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }

  # --- Root ---
  /:
    get:
      tags: [Internal]
      summary: API root info
      operationId: getRoot
      responses:
        "200":
          description: Basic API information
          content:
            application/json:
              schema:
                type: object
                properties:
                  app: { type: string }
                  version: { type: string }
                  api_v1: { type: string }
                  api_v2: { type: string }
  /api/v2/crm/acp/{kb_id}:
    get:
      tags:
      - crm-assistant
      summary: Get Icp
      description: Build and return the current ACP family for a KB.
      operationId: get_icp_api_v2_crm_acp__kb_id__get
      parameters:
      - name: kb_id
        in: path
        required: true
        schema:
          type: string
          title: Kb Id
      - name: collection_name
        in: query
        required: false
