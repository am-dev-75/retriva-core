  /api/v2/sessions/{session_id}/artifacts/{artifact_id}/content:
    get:
      tags:
      - v2-sessions
      summary: Download Artifact
      operationId: download_artifact_api_v2_sessions__session_id__artifacts__artifact_id__content_get
      parameters:
