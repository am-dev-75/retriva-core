                $ref: '#/components/schemas/QualifyResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v2/crm/readiness:
    get:
      tags:
      - crm-assistant
      summary: Readiness
      description: 'Structured preflight/readiness for the qualification pipeline.


        Reports the GLOBAL ACP/CCO state (never KB-specific), Web Research

        capability, GraphRAG availability, and whether qualification can

        proceed — with explicit blocking reasons.  Consumed by the chat agent

        preflight and by operational dashboards.'
      operationId: readiness_api_v2_crm_readiness_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}

  /api/v2/crm/sessions/{session_id}/jobs:
    get:
      tags:
      - crm-assistant
      summary: List Session Jobs
      description: 'List qualification jobs for a chat session (session-scoped).


        Enables cross-turn job resumption: a later chat turn can discover the

        jobs of ITS OWN session server-side, without relying on the LLM

        remembering job IDs from conversation text.  Only jobs of the requested

        session are returned — other sessions'' jobs are never exposed.


        Milestone A: archived terminal jobs of the session that are no

        longer in the in-memory registry are merged (``archived: true``)

        so resumption still finds them after restarts/recreation.'
      operationId: list_session_jobs_api_v2_crm_sessions__session_id__jobs_get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v2/sessions/artifacts:
    get:
      tags:
      - v2-sessions
      summary: List All Artifacts
      description: 'Artifact index across ALL sessions (most recent first).


        Powers the frontend artifact page: users should not need to know

        session IDs to find their generated reports.  Only non-expired,

        non-deleted artifacts are listed.'
      operationId: list_all_artifacts_api_v2_sessions_artifacts_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 200
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v2/sessions/{session_id}/artifacts:
    get:
      tags:
      - v2-sessions
      summary: List Artifacts
      operationId: list_artifacts_api_v2_sessions__session_id__artifacts_get
