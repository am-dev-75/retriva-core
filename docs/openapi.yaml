      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}

components:
  schemas:
    # --- Ingestion Schemas ---
    TextIngestRequest:
      type: object
      required: [source_path, content_text]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        content_text: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }

    HtmlIngestRequest:
      type: object
      required: [source_path, html_content]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        html_content: { type: string }
        origin_file_path: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }

    PdfIngestRequest:
      type: object
      required: [source_path, content_text, page_number]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        content_text: { type: string }
        page_number: { type: integer }
        total_pages: { type: integer }
        user_metadata: { type: object, additionalProperties: { type: string } }

    MarkdownSection:
      type: object
      required: [content]
      properties:
        heading: { type: string }
        content: { type: string }

    MarkdownIngestRequest:
      type: object
      required: [source_path, page_title, sections]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/MarkdownSection"
        user_metadata: { type: object, additionalProperties: { type: string } }

    ImageIngestRequest:
      type: object
      required: [source_path, file_path]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        file_path: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }

    MediaWikiIngestRequest:
      type: object
      required: [source_path, page_title, content_text]
      properties:
        source_path: { type: string }
        page_title: { type: string }
        content_text: { type: string }
        page_id: { type: integer }
        namespace: { type: integer }
        linked_assets:
          type: array
          items: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }

    ChunkIngestRequest:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          items: { type: object } # Simplification for Chunk

    IngestResponse:
      type: object
      required: [status, message]
      properties:
        status: { type: string }
        message: { type: string }
        job_id: { type: string }

    IngestResponseV2:
      type: object
      required: [status, message]
      properties:
        status: { type: string }
        message: { type: string }
        job_id: { type: string }
        doc_id: { type: string }
        content_hash: { type: string }
        deduplicated: { type: boolean, default: false }
        chunks_reused: { type: boolean, default: false }
        metadata_updated: { type: boolean, default: false }

    DocumentIngestRequestV2:
      type: object
      required: [source_uri]
      properties:
        source_uri:
          type: string
          description: Path or URI to the document to ingest.
        content_type:
          type: string
          description: Explicit MIME type hint.
        user_metadata:
          type: object
          additionalProperties: { type: string }
          description: Optional user-provided key/value metadata.
        parser_hint:
          type: string
          description: Force a specific parser backend (e.g. 'docling', 'ocrmypdf').
        kb_id:
          type: string
          default: default
          description: Target knowledge base id. Must exist in the registry.

    MediaWikiExportRequestV2:
      type: object
      required: [staged_dir]
      properties:
        staged_dir:
          type: string
          description: Local path to the staged directory containing XML exports and optional assets/ subtree.
        kb_id:
          type: string
          default: default
          description: Target knowledge base id. Must exist in the registry.
        user_metadata:
          type: object
          additionalProperties: { type: string }
          description: Optional user-provided key/value metadata.

    KBCreateRequest:
      type: object
      required: [name]
      properties:
        kb_id:
          type: string
          description: Optional explicit id matching ^[a-z0-9][a-z0-9_-]{0,63}$. Derived from name if omitted.
        name:
          type: string
          description: Human-readable label (1-128 chars).
        description:
          type: string
          description: Optional description (up to 1024 chars).
        settings:
          type: object
          description: Reserved for future per-KB settings.

    KBUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        settings:
          type: object

    KBResponse:
      type: object
      required: [kb_id, name, created_at, updated_at]
      properties:
        kb_id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        settings:
          type: object
        document_count:
          type: integer
          default: 0

    KBListResponse:
      type: object
      required: [kbs]
      properties:
        kbs:
          type: array
          items:
            $ref: "#/components/schemas/KBResponse"

    JobStage:
      type: string
      enum:
        [DETECTING, PREPROCESSING, PARSING, NORMALIZATION, CHUNKING, INDEXING, GRAPH_INDEXING]
      description: |
        Ordered stages of the v2 ingestion pipeline.
        GRAPH_INDEXING is optional and only runs when GRAPH_ENABLED=true.

    JobResponseV2:
      type: object
      properties:
        job_id: { type: string }
        status: { type: string }
        source: { type: string }
        job_type: { type: string }
        current_stage: { type: string }
        stages_completed: { type: array, items: { type: string } }
        stage_detail: { type: string, description: "Human-readable detail about the current stage (e.g. 'parsing chunk 7/14')" }
        progress: { type: number, format: float, description: "Optional 0.0–1.0 progress indicator for the current stage" }
        created_at: { type: string }
        updated_at: { type: string }
        error: { type: string }

    ArtifactRequestV2:
      type: object
      required: [artifact_type, format]
      properties:
        artifact_type: { type: string }
        format: { type: string }
        parameters: { type: object, additionalProperties: { type: string } }
        user_metadata: { type: object, additionalProperties: { type: string } }

    ArtifactResponseV2:
      type: object
      properties:
        status: { type: string }
        message: { type: string }
        job_id: { type: string }
        artifact_id: { type: string }

    ArtifactCapabilitiesResponseV2:
      type: object
      properties:
        supported_formats: { type: array, items: { type: string } }
        supported_types: { type: array, items: { type: string } }
        templates: { type: array, items: { type: string } }
        error: { type: string }

    JobResponse:
      type: object
      required: [job_id, status, source, job_type, created_at, updated_at]
      properties:
        job_id: { type: string }
        status: { type: string }
        source: { type: string }
        job_type: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
        error: { type: string }

    DocumentResponse:
      type: object
      required: [id, doc_id, source_path, page_title]
      properties:
        id: { type: string }
        doc_id: { type: string }
        kb_id: { type: string, default: default }
        filename: { type: string }
        size: { type: integer, default: 0 }
        ingestion_status: { type: string, default: completed }
        created_at: { type: string }
        source_path: { type: string }
        page_title: { type: string }
        user_metadata: { type: object, additionalProperties: { type: string } }
        metadata: { type: object, additionalProperties: { type: string } }
        match_reasons:
          type: array
          items: { type: string }

    DocumentListResponse:
      type: object
      required: [documents, total]
      properties:
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentResponse"
        total: { type: integer }

    DocumentCountResponse:
      type: object
      required: [count]
      properties:
        count: { type: integer }

    MetadataSchemaResponse:
      type: object
      required: [fields]
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFieldSchema"

    MetadataValuesResponse:
      type: object
      required: [key, values]
      properties:
        key: { type: string }
        values:
          type: array
          items:
            $ref: "#/components/schemas/MetadataValueInfo"

    RetrievalRequest:
      type: object
      required: [query]
      properties:
        query: { type: string }
        kb_ids:
          type: array
          items: { type: string }
          default: [default]
        metadata_filters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
        metadata_filter_mode:
          $ref: "#/components/schemas/MetadataFilterMode"
          default: soft
        top_k: { type: integer, default: 20 }
        rerank: { type: boolean, default: true }
        hybrid_selection: { type: boolean, default: true }
        retrieval_mode:
          type: string
          enum: [vector, graph_local, graph_global, hybrid, auto]
          default: vector
          description: |
            GraphRAG retrieval mode. When None, uses GRAPH_DEFAULT_RETRIEVAL_MODE.
            'vector' is the backward-compatible default.
            'graph_local' and 'hybrid' require GRAPH_ENABLED=true.
            'graph_global' and 'auto' are designed but not yet implemented.
        user_metadata_filter:
          type: object
          additionalProperties: { type: string }
          description: "[DEPRECATED] Use metadata_filters instead."

    RetrievalResponse:
      type: object
      required: [chunks]
      properties:
        chunks:
          type: array
          items: { type: object }
        entities:
          type: array
          items: { type: object }
          description: Graph entities (present when retrieval_mode is graph_local or hybrid).
        assertions:
          type: array
          items: { type: object }
          description: Evidence-backed assertions from the graph.
        relationships:
          type: array
          items: { type: object }
          description: Graph relationships traversed during retrieval.
        retrieval_mode:
          type: string
          description: The retrieval mode that was actually used.
        warnings:
          type: array
          items: { type: string }
        truncated:
          type: boolean
          description: True if graph traversal limits (max_nodes, max_edges) were reached.

    DocumentFilterRequest:
      type: object
      properties:
        metadata_filter:
          type: object
          properties:
            user_metadata:
              type: object
              additionalProperties: { type: string }

    # --- OpenAI Schemas ---
    ListModelsResponse:
      type: object
      properties:
        object: { type: string }
        data:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              object: { type: string }
              created: { type: integer }
              owned_by: { type: string }

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      properties:
        model: { type: string }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream: { type: boolean }
        temperature: { type: number }
        top_p: { type: number }
        kb_ids:
          type: array
          items: { type: string }
          default: [default]
          description: Knowledge base IDs to search.
        metadata_filters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
          description: Advanced metadata filters for retrieval.
        metadata_filter_mode:
          $ref: "#/components/schemas/MetadataFilterMode"
          default: soft
          description: Filtering mode (hard or soft).
        user_metadata_filter:
          type: object
          additionalProperties: { type: string }
          description: "[DEPRECATED] Use metadata_filters instead."

    ChatMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [system, user, assistant] }
        content: { type: string }
        metadata: { type: object }
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCall"
          description: Retriva extension carrying citation payloads.

    ToolCall:
      type: object
      required: [id, function]
      properties:
        id: { type: string }
        type: { type: string, default: function }
        function:
          $ref: "#/components/schemas/ToolCallFunction"

    ToolCallFunction:
      type: object
      required: [name, arguments]
      properties:
        name: { type: string }
        arguments: { type: string }

    ChatCompletionResponse:
      type: object
      properties:
        id: { type: string }
        object: { type: string }
        created: { type: integer }
        model: { type: string }
        choices:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              message:
                $ref: "#/components/schemas/ChatMessage"
              finish_reason: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer }
            completion_tokens: { type: integer }
            total_tokens: { type: integer }
        sources:
          type: array
          items: { type: object }

    # --- Shared Schemas ---
    MetadataFilterOperator:
      type: string
      enum: [eq, neq, contains, in, exists]

    MetadataFilter:
      type: object
      required: [field, operator]
      properties:
        field: { type: string }
        operator:
          $ref: "#/components/schemas/MetadataFilterOperator"
        value: {}

    MetadataFilterMode:
      type: string
      enum: [soft, hard]

    MetadataFieldSchema:
      type: object
      required: [field, type, operators]
      properties:
        field: { type: string }
        type: { type: string }
        operators:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilterOperator"

    MetadataValueInfo:
      type: object
      required: [value, count]
      properties:
        value: { type: string }
        count: { type: integer }

    DeleteMetadataRequest:
      type: object
      required: [user_metadata_filter]
      properties:
        user_metadata_filter:
          type: object
          additionalProperties: { type: string }

    DocumentSearchRequest:
      type: object
      properties:
        query: { type: string }
        kb_ids:
          type: array
          items: { type: string }
          default: [default]
        metadata_filters:
          type: array
          items:
            $ref: "#/components/schemas/MetadataFilter"
        metadata_filter_mode:
          $ref: "#/components/schemas/MetadataFilterMode"
