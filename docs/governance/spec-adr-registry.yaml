#
# Canonical location (Constitution v1.2 §43):
#   retriva-core/docs/governance/spec-adr-registry.yaml
#
# One project-wide sequence for specifications and one for ADRs,
# effective prospectively from Constitution v1.2 ratification
# (2026-10-03, ADR-028).  Historical artifacts keep their original
# numbers and paths (no renumbering); this registry records them so
# future allocations can detect collisions.
#
# Statuses: allocated | proposed | accepted | superseded | rejected |
# withdrawn.
#
# Backfill note (2026-10-04): entries 001–023 (specifications) and
# 001–028 (ADRs), plus the grandfathered gateway-local series, were
# recorded in this registry on 2026-10-04 as the disposition of
# governance records F-2/F-3
# (retriva-core/docs/governance/spec-numbering-followup-2026-10-03.md).
# Their allocation dates are unknown retroactively; the backfill date
# is recorded instead.  Number 017 (core specifications) was never used
# by any artifact and predates the registry; it is NOT recorded as an
# allocation and remains allocatable by a future governed change that
# records it here BEFORE the artifact is presented as PROPOSED.
#
# The number 014 specification collision (F-3) is recorded explicitly:
# the accepted directory pack 014-user-metadata-ingestion-v1 is the
# canonical owner of the number (cited by retriva-core/AGENTS.md);
# 014-structured-citations-v2 is recorded as the historical colliding
# entry with the standing owner decision documented in F-3.

