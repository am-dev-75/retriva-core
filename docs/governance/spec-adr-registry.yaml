  - number: "026"
    title: Durable v2 artifact generation jobs (Spec 025 extension)
    repository: retriva-core
    path: specs/026-v2-artifact-durable-jobs
    status: accepted
    allocated: "2026-10-05"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; migrates the v2 artifact generation workflow onto the
      durable Core jobs subsystem created by Spec 025 (the v2
      artifact flow was explicitly deferred by Spec 025 §4); one
      registered non-restart-safe job type; BackgroundTasks fallback
      and Celery share the same durable lifecycle; explicitly
      accepted for implementation by the owner on 2026-10-05 with
      four recorded decisions (preserved retrieval semantics with
      server-resolved durable collection context; artifact files
      never deleted by job retention; no client idempotency key;
      ADR-031 Core-owned)

  - number: "028"
    title: PostgreSQL-backed knowledge and ingestion metadata
    repository: retriva-core
    path: specs/028-postgresql-knowledge-metadata
    status: accepted
    allocated: "2026-10-05"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; implements the knowledge/ingestion metadata
      persistence follow-up explicitly deferred by Spec 024 (spec §5,
      plan.md §9) and ADR-029 (§Consequences); continues the
      project-wide sequence past 027 (number 017 was never used by
      any artifact and is intentionally left allocatable to avoid
      retroactive reordering of the accepted historical sequence);
      revision 1 presented 2026-10-05 and returned CHANGES_REQUESTED;
      revision 2 (2026-10-05) applies the owner's binding decisions:
      accepted cohort = v2 document + upload + mediawiki via ONE
      common knowledge service (artifacts excluded), schema `knowledge`
      + stream `core.knowledge` depending on core.platform + core.jobs
      (ordering/roles; no cascading FKs into job history), SQLite KB
      registry migrated to PostgreSQL knowledge.knowledge_bases,
      namespaced source identity (upload:/mediawiki:/connector:/
      internal:; path: legacy-only), document identity = tenant +
      normalized source identity (content-hash collapse classified
      LEGACY and corrected, no compat mode), one bounded
      knowledge.version_chunks row per expected Qdrant point with
      scale analysis, version-aware serving filter in Qdrant payloads
      (no per-search relational queries), inline qdrant_operations
      evidence with crash-window protocol (no relay outbox),
      authority/readiness states with fail-closed gating and NO
      legacy fallback switch, hybrid adoption with provenance classes
      and gated live sequence; explicitly accepted for implementation
      by the owner on 2026-10-05 (acceptance event recorded in the
      spec and ADR status sections)

  - number: "027"
    title: API v1 decommissioning and legacy job-state retirement
    repository: retriva-core
    path: specs/027-api-v1-decommissioning
    status: accepted
    allocated: "2026-10-05"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; revisions 1–2 (2026-10-05) proposed migrating legacy
      v1 ingestion workflows onto the durable Core jobs subsystem
      (revision 2 narrowed to one bounded-text route after
      CHANGES_REQUESTED); the owner then DIRECTED that Retriva API
      v1 may be dropped, superseding the migration direction;
      revision 3 (2026-10-05) re-scopes the phase to API v1
      decommissioning and legacy job-state retirement (hard removal
      of the nine v1 routers, complete JobManager retirement after
      shared-symbol relocation, Redis shim cleanup without
      destruction, durable v2 surfaces preserved); original path
      specs/027-v1-legacy-ingestion-durable-migration superseded by
      the rename; explicitly accepted for implementation by the
      owner on 2026-10-05 (acceptance event recorded in the spec
      and ADR status sections); implemented and validated the same
      day — closure audit SUCCESS, commit deferred to a separate
      owner instruction

  - number: "029"
    title: Durable-jobs canonical lock ordering
    repository: retriva-core
    path: specs/029-durable-jobs-lock-order
    status: accepted
    allocated: "2026-10-06"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; corrects the pre-existing durable-jobs lock-order
      defect observed during Spec 028 validation and classified in the
      post-deployment stabilization review (inverse cycle: claim path
      jobs->job_attempts vs eight completion/publication/cancellation
      paths job_attempts->jobs, producing SQLSTATE 40P01 deadlocks);
      defines the canonical invariant (acquire jobs before
      job_attempts), shared internal lock primitives, bounded
      idempotent retry as defense in depth, and a deterministic
      real-PostgreSQL concurrency gate; pristine-baseline reproduced at
      commit d19edc3; does NOT reopen Spec 028 / ADR-033; owner
      acceptance is REQUIRED before implementation (Constitution §42,
      §43); revision 1 presented 2026-10-06 and explicitly ACCEPTED by
      the owner on 2026-10-06 (acceptance event recorded in the spec
      and ADR status sections); implemented under isolated
      validation with exactly one local Core commit; live deployment
      deferred to a separate governed phase

  - number: "030"
    title: Upload idempotency, conflict mapping, and temp-file lifecycle
    repository: retriva-core
    path: specs/030-upload-idempotency-tempfile
    status: accepted
    allocated: "2026-10-07"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; corrects the duplicate-upload defect discovered during
      post-deployment stabilization (idempotency key content-stable but
      input fingerprint includes volatile temp_path/created_at, so an
      equivalent re-upload raised IdempotencyConflictError surfaced as
      HTTP 500 and leaked a temporary file); defines the canonical
      versioned upload input identity (stable semantic fields only),
      the bounded v2 409 conflict mapping, and an explicit temporary-
      file ownership/cleanup state machine; clarifies the accepted
      Spec 025 §3.1 / ADR-030 idempotency contract for the upload path
      and does NOT reopen Spec 028 / ADR-033 or Spec 029 / ADR-034;
      pristine-baseline reproduced deterministically on isolated
      PostgreSQL; owner acceptance is REQUIRED before implementation
      (Constitution §42, §43); revision 1 presented 2026-10-07

  - number: "031"
    title: Superseded-version Qdrant point lifecycle
    repository: retriva-core
    path: specs/031-superseded-point-lifecycle
    status: accepted
    allocated: "2026-10-07"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; defines retain-then-delete lifecycle, fail-closed purge
      eligibility, durable cleanup intent/evidence reusing
      knowledge.qdrant_operations (no migration), explicit-id bounded
      deletion with a mandatory read-only zero-point postcondition,
      idempotency/retry/ambiguity handling, dry-run, execution-model
      options, reconciliation classification, and tenancy/security
      constraints for Qdrant points belonging to superseded versions of
      active documents; cross-references Spec 028 / ADR-033 as the
      knowledge-metadata and Qdrant-operation foundation (not reopened);
      explicitly separate from Spec 030 upload-staging cleanup; owner
      acceptance and retention/execution decisions are REQUIRED before
      implementation; revision 1 presented 2026-10-07

  - number: "032"
    title: Bounded Celery/Redis worker-loss redelivery and R7 interaction
    repository: retriva-core
    path: specs/032-worker-loss-redelivery
    status: accepted
    allocated: "2026-10-08"
    notes: >-
      allocated per Constitution §43 before first presentation as
      PROPOSED; defines the transport-specific worker-loss redelivery bounds
      (Kombu Redis visibility_timeout, default 3600 s, no configuration
      surface) and their safe interaction with the R7 stale-RUNNING threshold
      (1800 s); supersedes the prompt-redelivery assumption in
      DETERMINATION-orphaned-running-recovery.md; recommends retaining
      V=3600/R=1800 with T8 claim/takeover and execution_generation fencing
      (Option B) and, as fallback, a governed configurable V (Option A) that
      requires bounding per-task hard time limits first; no migration; no
      product or configuration change; owner acceptance REQUIRED before
      implementation (Constitution §42, §43)

  - number: "033"
    title: Incident-specific no-effect dispatch-unknown terminalization
    repository: retriva-core
    path: specs/033-incident-terminalization
    status: accepted
    allocated: "2026-10-08"
    notes: >-
      allocated per Constitution §43 before first presentation as PROPOSED;
      records that the owner-required dispositions (attempt FAILED, job FAILED
      from dispatch_unknown) are not legal in the accepted state machine and
      therefore require either new governed transitions (Option 1) or an
      implementation via existing legal transitions with a privileged
      job-scoped operator command (Option 2, recommended); no migration; owner
      acceptance REQUIRED before implementation

